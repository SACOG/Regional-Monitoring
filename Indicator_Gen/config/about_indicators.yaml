  SACOG Permit Data:
    Source:
    - SACOG Housing Inventory
    Time Period:
    - Year by Year
    Period Sourced:
    - 8-12-24
    Last Updated:
    - 
    Website:
    - https://data.sacog.org/datasets/6b83a77ef4f82801946e004f38e_20/explore?location=38.784891%2C-121.127367%2C8.44
    Notes:
    - |
    
      "Detailed yearly permit data for the SACOG region. This is derived from SACOG housing permit inventory database. From 2000-2019, it was compiled using a direct request for completed housing units from individual jurisdictions within the SACOG region. The period of 2020 to present uses the Housing Community and Development (HCD) Annual Progress Report (APR) template used for the Regional Housing Needs Allocation program (RHNA). Community type (COMTYP) areas are local land use plans (adopted and proposed general plans, specific plans, master plans, corridor plans, etc.) translated into one of five Community Types based on the location and development pattern of the area. As housing and job growth occurs over time, specific geographic areas evolve, such as from lands not identified for development, to developing communities; developing communities to established communities; and established communities to centers and corridors. Green Means Go (GRZ) areas is a multi-year pilot that aims to lower greenhouse gas emissions in the six-county Sacramento region by accelerating infill development, and reducing and electrifying vehicle trips. Green Means Go allocates state funding to projects that create more infill housing, increase mobility, and reduce vehicle emissions.

      As of 09/8/24 the following years have data missing from the following jurisdictions for the HCD period:
      2018: WHEATLAND
      2019: ISLETON, MARYSVILLE, WHEATLAND
      2020: COLFAX, ISLETON, WHEATLAND
      2021: ISLETON, MARYSVILLE
      2022: ISLETON, MARYSVILLE
      2023: COLFAX, ISLETON

      Added COMM _TYPE or Community types: No Community Type and South Lake Tahoe. No Community Type refers to the period of 2001 to 2007 Housing permit records. Community types land use were not defined yet thus no community types were not  assigned from 2001-2007.
      
      South Lake Tahoe (SLT) community type are just designation of housing units that fall within the SLT boundaries. SACOG planning boundary do not fall within SLT.

      There are differing community types by time period. Housing permits that were FINALED during a certain year will be defined by that period Community Types. The following time period is used to defined that Community Type for that record year: 

      2001-2007: No Community Type
      2008-2011: 2008 to 2011 Community Types
      2012-201: 2012 to 201 Commuinity Types
      2016-2019: 2016-2019 Community Types
      2020 to Current: 2020-2040 (MTP/SCS)
      "
