      2021: ISLETON, MARYSVILLE\n
      2022: ISLETON, MARYSVILLE\n
      2023: COLFAX, ISLETON\n
      \n
      Added COMM _TYPE or Community types:\n
      No Community Type and South Lake Tahoe\n
      No Community Type refers to the period of 2001 to 2007 Housing permit records\n
      Community types land use were not defined yet thus no community types were not assigned from 2001-2007\n
      \n
      South Lake Tahoe (SLT) community type are just designation of housing units that fall within the SLT boundaries\n
