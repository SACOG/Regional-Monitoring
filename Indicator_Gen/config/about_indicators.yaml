      The monitoring program uses the decennial census benchmark for the decennial years (2000, 2010, 2020 etc.).\n
      The decennial census benchmark is for April 1st of the decennial year; all other population estimates are for January 1st of the given year.\n
      Key terms \n
      Household Population is a subset of total Population. Household Population excludes those
      residing in group quarters (college dorms, group homes, nursing homes or correctional facilities) \n
      Growth Rate (GR) is the percent change compared to the prior year'

  Pop_5:
    Indicator Title:
    - Population growth rate in largest regions
    Source:
    - California Department of Finance E- (current decade) and E-8 (prior) series
    Year(s):
    - 2000-2024
    Description:
    - Percent change year over year
    Geography:
    - California jurisdictions, counties, and MPO's
    Website:
    - https://dof.ca.gov/forecasting/demographics/estimates/
    Last Updated:
    - 
    Notes: 
    - '\n The Department of Finance prepares its population estimates in ten-year series.\n
      Each ten-year series begins with the results of the decennial census (census benchmark).\n
      Users should pay careful attention when using data that spans two decennial census
      periods, as the difference between the final year of the prior series and the
      first of the new may stem largely from the new census benchmark.\n
      The monitoring program uses the decennial census benchmark for the decennial years (2000, 2010, 2020 etc.). \n
      The decennial census benchmark is for April 1st of the decennial year; all other population estimates are for January 1st of the given year.\n
      This measure looks at the largest regions in the state (Bay Area, Los Angeles, San Diego, Sacramento and San Joaquin Valley).\n
      Regions are defined by their respective Metropolitan Planning Organization (MPO), except the San Joaquin Valley uses a custom 
      classification of Fresno, Kern, Kings, Madera, Merced, San Joaquin and Stanislaus counties.\n
      Key terms\n
      Household Population is a subset of total Population. Household Population excludes those
      residing in group quarters (college dorms, group homes, nursing homes or correctional facilities)\n
      Growth Rate (GR) is the percent change compared to the prior year'




