# MASTER FILE FOR ABOUT TAB EXPORTS.

# If you want to edit any of these indicators, it's easiest to just CTRL + F the sample or indicator, and edit from there. 

# A lot of these were built from already existing about tabs. 

# Note: For the Census, we have both  year and 1 year samples we have to worry about.
# Bc of this, there are two nests. 'YEAR' and '1YEAR'. User must define which one they want to pull by defining so in the function call. 

DOF:  

  Pop_1:
    Indicator Title:
    - Total population
    Source:
    - California Department of Finance E-5 (current decade) and E-8 (prior) series
    Year(s):
    - 2000-2024
    Description:
    - Estimated population
    Geography:
    - California jurisdictions, counties, and MPO's
    Website:
    - https://dof.ca.gov/forecasting/demographics/estimates/
    Last Updated:
    - 
    Next Update:
    - 2025-02-01
    Notes: 'The Department of Finance prepares its population estimates in ten-year series. \n
      Each ten-year series begins with the results of the decennial census (census benchmark). \n
      Users should pay careful attention when using data that spans two decennial census periods, 
      as the difference between the final year of the prior series and the first of the new may 
      stem largely from the new census benchmark. \n
      The monitoring program uses the decennial census benchmark for the decennial years (2000, 2010, 2020 etc.). \n
      The decennial census benchmark is for April 1st of the decennial year; all other population estimates are for January 1st of the given year.
      Key terms \n
      Household Population is a subset of total Population. Household Population excludes those
      residing in group quarters (college dorms, group homes, nursing homes or correctional facilities) \n
      Growth Rate (GR) is the percent change compared to the prior year'

