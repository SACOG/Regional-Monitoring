TMAG:
  Source:
    Source: Conveyal, Overture, California Department of Education, SACOG Transportation Modeling and Analysis Group
    Website: https://conveyal.com/
    Last Updated:
  Sample:
    Year(s): 2024 Overture POI data, 2023-2024 California Department of Education, 2023 ACS5-year population data
    Geography: Community Type, Counties, MPO
    Notes: 'This indicator estimates the number of jobs, schools, or neighborhood services accessible by transit mode.\n
      Conveyal applies a decay curve rather than a fixed time cutoff to estimate the sum all opportunities in the region, with each opportunity weighted by the population in that region.\n
      The number of jobs, schools, and neighborhood services is estimated using a point of interest dataset prepared by SACOG (sourced from Overture and CDE).\n
      The measure defines educational facilities as public and private K-12 schools, pre-schools, and universities, including vocational and technical schools.\n
      The measure defines neighborhood services as public parks, healthcare facilities, retail stores, banks, grocery stores, and libraries.\n
      The population is estimated using ACS 2023 5-year estimates at the block group level.'
  Indicators:
    TravelAccess_1:
      Title: Travel Accessibility by Mode
      Description: Number of jobs, schools, and neighborhood services accessible by travel mode
    TravelAccess_2:
      Title: Travel Accessibility by Race/Ethnicity
      Description: Number of jobs, schools, and neighborhood services accessible by travel mode by race/ethnicity

