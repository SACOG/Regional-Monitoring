# MASTER FILE FOR ABOUT TAB EXPORTS.

DOF:
  Source:
    Source: California Department of Finance E-5 (current decade) and E-8 (prior) series
    Website: https://dof.ca.gov/forecasting/demographics/estimates/
    Last Updated:
  Sample:
    Year(s): 2000-2026
    Geography: Jurisdiction, county
    Notes: 'The Department of Finance prepares its population estimates in ten-year series. \n
          Each ten-year series begins with the results of the decennial census (census benchmark). \n
          Users should pay careful attention when using data that spans two decennial census periods, 
          as the difference between the final year of the prior series and the first of the new may 
          stem largely from the new census benchmark. \n
          The monitoring program uses the decennial census benchmark for the decennial years (2000, 2010, 2020 etc.). \n
          The decennial census benchmark is for April 1st of the decennial year; all other population estimates are for January 1st of the given year.
          Key terms \n
          Household Population is a subset of total Population. Household Population excludes those
          residing in group quarters (college dorms, group homes, nursing homes or correctional facilities) \n
          Growth Rate (GR) is the percent change compared to the prior year'
  Indicators:
    Pop_1:
      Title: Total population
      Description: An estimate of total population.
    Pop_2:
      Title: Population growth rate
      Description: An estimate of population percent change year over year.
    Pop_5:
      Title: Population growth rate in largest regions
      Description: An estimate of population percent change year over year by California regions.

ACS:
  Source:
    Source: U.S. Census Bureau, American Community Survey (ACS)
    Website: https://www.census.gov/programs-surveys/acs/data.html
    Last Updated:
  ACS5:
    Estimate: 5-year estimates
    Year(s): 2009-2024
    Geography: Block group, census tract, census designated place, county, MSA, congressional district, and state legislative district
    Notes: 'Key terms\n
        Rolling Average: The data are reported in 5 year rolling averages. For example, 
        the 2024 output is not the individual year of 2024, but the  year average of 2020-2024.\n 
        Users looking for single year results should use the separate 1 year ACS series.\n
        Margin of Error: All ACS outputs are estimates. The downloadable data includes 
        the margin of error statistics. Users should pay particular to the margin of error,\n
        especially for smaller geographies and race/ethnicity groups with relatively less population.\n
        SACOG uses a margin of error threshold of 5%, i.e. any margin of error greater than 5% of the estimate itself is not included on any official reporting.'
  ACS1:
    Estimate: 1-year estimates
    Year(s): 2005-2024
    Geography: Census designated place, county, MSA, congressional district, and state legislative district
    Notes: 'ACS 1 year estimates for 2020 are not available.\n
        Key terms\n
        The data are reported in yearly estimates. For example, 
        the 2024 output is for the individual year of 2024, not a 5 year average of 2020-2024.\n
        Users looking for 5-year estimates should use the 5 year ACS series.\n
        Margin of Error: All ACS outputs are estimates. The downloadable data includes 
        the margin of error statistics. Users should pay particular to the margin of error,\n
        especially for smaller geographies and race/ethnicity groups with relatively less population.\n
        SACOG uses a margin of error threshold of 5%, i.e. any margin of error greater than 5% of the estimate itself is not included on any official reporting.'
  Indicators:
    Pop_3:
      Title: Population by Race/Ethnicity
      Description: An estimate for total population by race/ethnicity, as well as the percentage.
      Table(s): B03002
    Pop_4:
      Title: Population by Age Cohorts
      Description: An estimate for total population in three age cohorts (under 18, 18 to 64, and over 65), as well as the percentage.
      Table(s): B01001
    Pop_6:
      Title: Birth Rates
      Description: An estimate for the total number of births from women aged 15-44 within last year and an estimated birth rate per 1,000 people.
      Table(s): B13016
    Pop_8:
      Title: Marriage Status
      Description: An estimate for the total population of marriage status for population aged 18-44 (never married, married, divorced, or widowed).
      Table(s): B12002
    Pop_9:
      Title: Location 1 Year Ago
      Description: An estimate for otal population based on location of residence 1 year ago.
      Table(s): B07204
    Labor_1:
      Title: Labor Force Participation
      Description: 'This indicator shows the total working age population in the formal labor force by race/ethnicity.\n
        Excludes persons in Armed Forces, persons under age 16, and persons age 65 and over.'
      Table(s): BB23001, C23002B, C23002C, C23002D, C23002E, C23002F, C23002G, C23002H, C23002I
    Cost_3:
      Title: Unoccupied Housing Units
      Description: An estimate of residential housing occupancy.
      Table(s): B25002, B25004
    Cost_5:
      Title: Homeownership by Race/Ethnicity
      Description: 'An estimate of household homeownership by race/ethnicity.\n
        This indicator is measured at the household (not individual) level.\n
        Compares home ownership and renters between occupied units only.\n
        Homeownership by Race/Ethnicity estimates the portion of households, by race/ethnicity,
        that are renters (renter occupied) and those that are homeowners (owner occupied)'
      Table(s): B25003, B25003B-I
    Income_1:
      Title: Median Household Income
      Description: 'An estimate of median household income in inflation adjusted dollars.\n
        Inflation adjustments estimated using Bureau of Labor Statistics Consumer Price Index.\n
        https://www.bls.gov/regions/west/news-release/consumerpriceindex_west.htm'
      Table(s): B19013B-I
    Income_3:
      Title: Median Household Income by Race/Ethnicity
      Description: 'This indicator compares the median household income (in inflation-adjusted dollars) by individual race/ethnicities to the regional average.\n
        A value above 1 means the groups has a median household income above regional median (while below 1 means below regional level).\n
        Inflation adjustments estimated using Bureau of Labor Statistics Consumer Price Index.\n
        https://www.bls.gov/regions/west/news-release/consumerpriceindex_west.htm'
      Table(s): B19013B-I
    Income_4:
      Title: Poverty Rate by Race/Ethnicity
      Description: 'Measures households living in poverty using the census official poverty measure.\n 
        The census poverty measure compares pretax money to a threshold adjusted by family size and\n 
        for inflation through time. Importantly, the Census Bureau uses the same poverty threshold\n 
        throughout the United States, which does not fully reflect the effect of high housing costs\n 
        in states such as California. Recognizing this limitation, the monitoring program uses the\n 
        indicator for a relative comparison across race/ethnicity.'
      Table(s): B17020, B17020B-I
    Income_5:
      Title: Median Home Value by Race/Ethnicity
      Description: 'An estimate of median home values in inflation adjusted dollars.\n
        Inflation adjustments estimated using Bureau of Labor Statistics Consumer Price Index.\n
        https://www.bls.gov/regions/west/news-release/consumerpriceindex_west.htm\n
        The Federal Reserve 2022 Survey of Consumer Finances treats home value variation as a primary wealth disparity signal.\n
        Wealth Disparity Index = Homeownership rate x median home value (per household, all tenure)\n
        This metric does not account for the extent of mortgage debt, and does not account for other important demographic variations, such as differences in age composition across racial and ethnic groups.\n
        This metric is a derivative of the wealth-building opportunities indicators organized by the Urban Institute Upward Mobility Initiative.'
      Table(s): B25077, B25077B-I, B25003, B25003B-I
    Income_7:
      Title: Households by Mortgage Status
      Description: 'An estimate of households by mortgage status'
      Table(s): B25081
    Commute_1:
      Title: Population by Mode of Commute
      Description: 'An estimate for population by travel mode to work.'
      Table(s): B08301
    Edu_1:
      Title: Educational Attainment by Race/Ethnicity
      Description: 'An estimate for population by educational attainment and race/ethnicity.\n
        Educational attainment is based on residents 26 years or older.'
      Table(s): B15002, C15002B-I
    Health_2:
      Title: Health Insurance by Race/Ethnicity
      Description: 'An estimate for number of persons with and without health insurance.'
      Table(s): B27001, C27001B-I
    Broadband_2:
      Title: Household Internet Access by Race/Ethnicity
      Description: 'An estimate for number of households by internet access by race/ethnicity.\n
        Low speed defined as having a computer with dial-up internet subscription alone while high speed defined as computer with broadband internet subscription.\n
        Metric is tracked by number of households, not individuals.'
      Table(s): B28003, B28009B-I
    Broadband_3:
      Title: Cellular Data Plan
      Description: 'An estimate for number of people with a cellular data plan.'
      Table(s): B28002
    Housing_1:
      Title: Cost Burden
      Description: 'An estimate for number of households by percent of income spent on housing.'
      Table(s): B25140
    Housing_5:
      Title: Cost Burden
      Description: 'An estimate for number of households by percent of income spent on housing.'
      Table(s): B25070, B25091
    Housing_6:
      Title: Cost Burden
      Description: 'An estimate for number of households by percent of income spent on housing.'
      Table(s): B25070, B25091
      
      
