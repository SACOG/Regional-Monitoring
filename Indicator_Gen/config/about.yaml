    Website: https://www.bea.gov/
    Last Updated:
  Sample:
    Notes: 'The value of final goods and services produced in the United States is the gross domestic product.\n
        The percentage that GDP grew (or shrank) from one period to another is an important way for a region to gauge how their economy is doing.\n
        This indicator uses Real GDP in Chained Dollars, which is an inflation-adjusted measure.'
  Indicators:
