EDD:
  Source:
    Source: SACOG analysis of Quarterly Census of Employment and Wages (QCEW)
    Website: https://www.bls.gov/cew/
    Last Updated:
  Sample:
    Notes: 'Employment estimates only cover a subset of the economy (employment covered by Unemployment Insurance),\n
      so does not include estimates on self-employed, some agricultural workers, most employees of railroads, or members of the Armed Forces.\n
      As such, the employment totals in this indicator are different (smaller) than the estimates in the other job measures, which aim to capture total employment.\n
      \n
      Tradeable sector firms are defined as those producing goods or services that can be exported outside of the region.\n
      Analysis uses the NAICS system down to the six-digit level.\n
      Even at the six-digit level, some NAICS industries are a mix of tradeable and local functions.\n
      See NAICS tab for the tradeable sector definitions used in this analysis.\n
      Public administration is treated as a separate category.\n
      Much of the public administration employment in the region is not tied local population, but instead to employment in state government'
  Indicators:
    Jobs_6:
      Title: Estimated Number of Jobs in Tradeable Sectors
      Description: Quarterly estimates of number of people employed by business type - tradeable sector, local oriented, or public administration
      Year(s): 2024-2025
      Geography: MSA

