    Income_4:
      Indicator Title: Poverty rate by race/ethnicity
      Source: Census 5 year ACS (American Community Survey)
      Year(s): 2009-2024
      Description: 5 year rolling average of % of households within census federal definition of poverty
      Geography: Block groups, census tracts, counties, MSA's, and MPO's
      Website: https://www.census.gov/programs-surveys/acs/data.html
      Last Updated: 
      Next Update: '2027-01-15'
      Margin of Error Limit: 5
      Notes: 'Measures households living in poverty using the census official poverty measure. 
        The census poverty measure compares pretax money to a threshold adjusted by family size and 
        for inflation through time. Importantly, the Census Bureau uses the same poverty threshold 
        throughout the United States, which does not fully reflect the effect of high housing costs 
        in states such as California. Recognizing this limitation, the monitoring program uses the 
        indicator for a relative comparison across race/ethnicity.\n
        Key terms\n
        Rolling Average: The data are reported in 5 year rolling averages. For example, 
        the 2022 output is not the individual year of 2022, but the  year average of 2018-2022. 
        Users looking for single year results should use the separate 1 year ACS series.\n
        Margin of Error: all ACS outputs are estimates. The downloadable data includes 
        the margin of error statistics. Users should pay particular to the margin of error, 
        especially for smaller geographies and race/ethnicity groups with relatively less population.'

