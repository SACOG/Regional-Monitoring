FDIC:
  Source:
    Source: Federal Deposit Insurance Corporation (FDIC)
    Website: https://household-survey.fdic.gov/custom-data
    Last Updated:
  Sample:  
    Year(s): 2015-2023
    Geography: Sacramento 4-County MSA
    Notes: FDIC Advisory Committee on Economic Inclusion formally defines "underserved" as "households that are either unbanked or underbanked" as the federal regulatory definition.\n
      FDIC sample size doesn't support MSA-level race breakdowns or Yuba City MSA estimates.\n
      Sacramento MSA shown as time series; California state-level race breakdown shown for equity context.
  Indicators:
    Income_8:
      Title: Households Without Full Banking Access
      Description: An estimate for the share of households with either no bank account (unbanked) or a bank account but reliant on non-bank financial services (underbanked).\n
        Unbanked = Household has no checking or savings account\n
        Underbanked = Household has a bank account but used non-bank money orders, check cashing, payday loans, rent-to-own services, pawn shops, refund anticipation loans, or auto title loans in the past 12 months\n
        No full banking access = Unbanked + Underbanked = 100% - fully banked
  
