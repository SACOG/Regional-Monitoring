CEC:
  Source:
    Source: California Energy Comission (CEC)
    Website: https://www.eia.gov/
    Last Updated:
  Sample:
    Notes: 'Zero Emission Vehicles (ZEV) sales, updated on a quarterly basis by examining the DMV Vehicle Registration 
      database for vehicles which show no evidence of transfer of ownership, and were purchased within the specified timeframe. 
      To account for vehicles which may have been brought in from outside California, only those vehicles with a low odometer reading are treated as new sales.\n
      ZEV: Zero Emission Vehicles, includes BEVs, PHEVs, and FCEVs\n
      BEV: Battery Electric Vehicle\n
      PHEV: Plug-in Hybrid Electric Vehicles\n
      FCEV: Fuel Cell Electric Vehicles\n
      Non-ZEV: Non- Zero Emission Vehicles\n
      MSA: Metropolitan Statistical Area\n
      California Energy Commission (2024). California Energy Commission Zero Emission Vehicle and Infrastructure Statistics. Data last updated August 6, 2024. Retrieved Oct 31, 2024 from http://www.energy.ca.gov/zevstats.'
  Indicators:
    Road_4:
      Title: New Zero Emission Vehicle Sales
      Description: Zero Emission Vehicles (ZEV) sales, updated on a quarterly basis
      Year(s): 1998-2023
      Geography: California and National

BEA:
  Source:
