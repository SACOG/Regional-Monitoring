# Previous housing indicators notes:
    # Notes: 'Detailed yearly permit data for the SACOG region. This is derived from SACOG housing permit inventory database.\n
    #   From 2000-2019, it was compiled using a direct request for completed housing units from individual jurisdictions within the SACOG region.\n
    #   The period of 2020 to present uses the Housing Community and Development (HCD) Annual Progress Report (APR) template used for the Regional 
    #   Housing Needs Allocation program (RHNA). Community type (COMTYP) areas are local land use plans (adopted and proposed general plans, specific 
    #   plans, master plans, corridor plans, etc.) translated into one of five Community Types based on the location and development pattern of the 
    #   area. As housing and job growth occurs over time, specific geographic areas evolve, such as from lands not identified for development, to 
    #   developing communities; developing communities to established communities; and established communities to centers and corridors.\n
    #   Green Means Go (GRZ) areas is a multi-year pilot that aims to lower greenhouse gas emissions in the six-county Sacramento region by accelerating 
    #   infill development, and reducing and electrifying vehicle trips. Green Means Go allocates state funding to projects that create more infill 
    #   housing, increase mobility, and reduce vehicle emissions.\n
    #   \n
    #   As of 09/8/24 the following years have data missing from the following jurisdictions for the HCD period:\n
    #   2018: WHEATLAND\n
    #   2019: ISLETON, MARYSVILLE, WHEATLAND\n
    #   2020: COLFAX, ISLETON, WHEATLAND\n
    #   2021: ISLETON, MARYSVILLE\n
    #   2022: ISLETON, MARYSVILLE\n
    #   2023: COLFAX, ISLETON\n
    #   \n
    #   Added COMM _TYPE or Community types:\n
    #   No Community Type and South Lake Tahoe\n
    #   No Community Type refers to the period of 2001 to 2007 Housing permit records\n
    #   Community types land use were not defined yet thus no community types were not assigned from 2001-2007\n
    #   \n
    #   South Lake Tahoe (SLT) community type are just designation of housing units that fall within the SLT boundaries\n
    #   SACOG planning boundary do not fall within SLT\n
    #   \n
    #   There are differing community types by time period. Housing permits that were FINALED during a certain year will be defined by that period Community Types\n
    #   The following time period is used to defined that Community Type for that record year:\n
    #   2001-2007: No Community Type\n
    #   2008-2011: 2008 to 2011 Community Types\n
    #   2012-2015: 2012 to 2015 Commuinity Types\n
    #   2016-2019: 2016-2019 Community Types\n
    #   2020 to Current: 2020-2040 (MTP/SCS)\n'