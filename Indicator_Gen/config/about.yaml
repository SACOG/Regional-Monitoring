SACOG Housing:
  Source:
    Source: SACOG Housing Permit Inventory
    Website: https://data.sacog.org/
    Last Updated:
  Sample:
    Year(s): 2001-2025
    Geography: Six County Sacramento Region, California Regions
    Notes: 'The SACOG Housing Permit Inventory is a custom dataset.\n
      From 2000-2017, SACOG collected completed housing unit numbers directly from each jurisdiction with the SACOG region.\n
      Starting in 2018, the database uses the Housing and Community Development (HCD) Annual Progress Report (APR) data as the starting point,\n
      then supplements this base with information from SACOG jurisdictions and a quality control check.
      \n
      As of July 9, 2025, the following jurisdictions have missing data:\n
      2018: Wheatland\n
      2019: Isleton, Marysville, Wheatland\n
      2020: Colfax, Isleton, Wheatland\n
      2021: Isleton, Marysville\n
      2022: Isleton, Marysville\n
      2023: Colfax, Isleton\n
      2024: Winters, Live Oak, Isleton\n
      \n
      Missing data results from jurisdictions that did not submit completed housing data through either HCD APR or supplemental SACOG data collection efforts.'
  Indicators:
    Production_1:
      Title: Total Dwelling Units
      Description: 'The number of completed housing units by year'
    Production_2:
      Title: Total new dwelling units by single family/multi-family
      Description: 'The number of permitted units per year, broken out by single family vs multi family units.\n
        The dataset uses a custom definition for California regions:\n
        The Metropolitan Planning Organization boundaries for the Bay Area (MTC), Los Angeles (SCAG), San Diego (SANDAG), and Sacramento (SACOG) regions.\n
        It includes a multi-county Central Valley region that consists of each valley county south of Sacramento and north of Los Angeles.\n
        It then includes a category (Rest of State) for any county in the state not covered by these categories.\n
        This indicator also relies on information from DOF demographic estimates:\n
        https://dof.ca.gov/forecasting/demographics/estimates/'
    Production_3:
      Title: Housing growth rate (per 1,000 residents)
      Description: 'The estimated number of new housing units each year per 1,000 residents\n
        The dataset uses a custom definition for California regions:\n
        The Metropolitan Planning Organization boundaries for the Bay Area (MTC), Los Angeles (SCAG), San Diego (SANDAG), and Sacramento (SACOG) regions.\n
        It includes a multi-county Central Valley region that consists of each valley county south of Sacramento and north of Los Angeles.\n
        It then includes a category (Rest of State) for any county in the state not covered by these categories.\n
        This indicator also relies on information from DOF demographic estimates:\n
        https://dof.ca.gov/forecasting/demographics/estimates/'
    Production_4:
      Title: Pop Growth compared to Housing Growth
      Description: Actual housing production compared with healthy housing market needs (1/2 of population growth).\n
        This indicator compares housing production to population growth in the Sacramento region.\n
        The measure tracks new housing units built each year compared to the estimated number of new households formed (estimated as 1 new household for every 2.5 residents added).\n
        As the indicator uses the simplistic assumption of a need of 0.4 new units per new resident and does not account for an existing housing shortage,\n
        it is meant to be a top-level comparison that complements other measures such as the housing rate.\n
        DOF data suggests the region lost population in 2021 and 2022, which is why the household estimate goes negative those years.\n
        This indicator also relies on information from DOF demographic estimates:\n
        https://dof.ca.gov/forecasting/demographics/estimates/'
    Production_5:
      Title: Map of unit growth at jurisdiction level
      Description: 'Detailed yearly permit data for the SACOG region. This is derived from SACOG housing permit inventory database.\n
        From 2000-2019, it was compiled using a direct request for completed housing units from individual jurisdictions within the SACOG region.\n
        The period of 2020 to present uses the Housing Community and Development (HCD) Annual Progress Report (APR) template used for the Regional 
        Housing Needs Allocation program (RHNA). Community type (COMTYP) areas are local land use plans (adopted and proposed general plans, specific 
        plans, master plans, corridor plans, etc.) translated into one of five Community Types based on the location and development pattern of the 
        area. As housing and job growth occurs over time, specific geographic areas evolve, such as from lands not identified for development, to 
        developing communities; developing communities to established communities; and established communities to centers and corridors.\n
        Green Means Go (GRZ) areas is a multi-year pilot that aims to lower greenhouse gas emissions in the six-county Sacramento region by accelerating 
        infill development, and reducing and electrifying vehicle trips. Green Means Go allocates state funding to projects that create more infill 
        housing, increase mobility, and reduce vehicle emissions.'
    Production_6:
      Title: Housing production by product type
      Description: Completed housing units by housing product type include Single Family (with sub categories of large lot, small lot, and rural residential) and Multifamily (with sub categories of 2 to 4 units and 5+ units).
    Production_7:
      Title: Accessory Dwelling Unit Housing Production
      Description: Completed Accessory Dwelling Units (ADUs) by year
    Location_1:
      Title: Completed housing units by community type
      Description: 'Completed housing units by community type (Centers and Corridors, Established Communities, Developing Communities, Rural Residential, and Agricultural/Natural Resources land).\n
        The indicator uses the community type that was active when the unit was completed- 2001-2007 (No community type data), 2008-2011, 2012-2015, 2016-2019, and 2020-2024.'
    Location_2a:
      Title: Share of housing built within Green Zones
      Source: SACOG Housing Permit Inventory
      Year(s): 2001-2024
      Description: 'Percentage of new housing units per year that occur within Green Zones.\n
        Green Zones are locally adopted areas with the regional Green Means Go program.\n
        The measure tracks back to 2001, even though Green Zones did not become adopted until starting in 2019.'
    Location_2b:
      Title: Type of housing built in Green Zones
      Source: SACOG Housing Permits Inventory
      Year(s): 2001-2024
      Description: 'Type of new housing (Multi Family, Single Family Small Lot, and Single Family Large Lot) in Green Zones compared to Non-Green Zones.\n
        Green Zones are locally adopted areas with the regional Green Means Go program.\n
        The measure tracks back to 2001, even though Green Zones did not become adopted until starting in 2019.'
    Location_3:
      Title: New housing on agricultural lands    
    Location_4:
      Title: Housing units built in floodplain, high fire risk zones
      Source: SACOG Housing Permit Inventory for units, 
      Year(s): 2018-2023
      Description: 'This indicator also relies on information from FEMA 100 year flodplain for flood and Office of the Fire Marshall Fire Hazard Severity Zones for fire risk zone.\n
        The indicator uses the community type that was active when the unit was completed- 2001-2007 (No community type data), 2008-2011, 2012-2015, 2016-2019, and 2020-2024.'
    Policy_5:
      Title: Units added by product type compared to MTP projection
      Source: SACOG Permit
      Year(s): 2018-2023
      Description: 'Detailed yearly permit data for the SACOG region. This is derived from SACOG housing permit inventory database.\n
        From 2000-2019, it was compiled using a direct request for completed housing units from individual jurisdictions within the SACOG region.\n
        The period of 2020 to present uses the Housing Community and Development (HCD) Annual Progress Report (APR) template used for the Regional 
        Housing Needs Allocation program (RHNA). Community type (COMTYP) areas are local land use plans (adopted and proposed general plans, specific 
        plans, master plans, corridor plans, etc.) translated into one of five Community Types based on the location and development pattern of the 
        area. As housing and job growth occurs over time, specific geographic areas evolve, such as from lands not identified for development, to 
        developing communities; developing communities to established communities; and established communities to centers and corridors.\n
        Green Means Go (GRZ) areas is a multi-year pilot that aims to lower greenhouse gas emissions in the six-county Sacramento region by accelerating 
        infill development, and reducing and electrifying vehicle trips. Green Means Go allocates state funding to projects that create more infill 
        housing, increase mobility, and reduce vehicle emissions.'
      Geography: SACOG region
      Website: https://data.sacog.org/
      Last Updated: 
      Next Update: '2025-09-01'
      Notes: '
        As of 09/8/24 the following years have data missing from the following jurisdictions for the HCD period:\n
        2018: WHEATLAND\n
        2019: ISLETON, MARYSVILLE, WHEATLAND\n
        2020: COLFAX, ISLETON, WHEATLAND\n
        2021: ISLETON, MARYSVILLE\n
        2022: ISLETON, MARYSVILLE\n
        2023: COLFAX, ISLETON\n
        \n
        Added COMM _TYPE or Community types:\n
        No Community Type and South Lake Tahoe\n
        No Community Type refers to the period of 2001 to 2007 Housing permit records\n
        Community types land use were not defined yet thus no community types were not assigned from 2001-2007\n
        \n
        South Lake Tahoe (SLT) community type are just designation of housing units that fall within the SLT boundaries\n
        SACOG planning boundary do not fall within SLT\n
        \n
        There are differing community types by time period. Housing permits that were FINALED during a certain year will be defined by that period Community Types\n
        The following time period is used to defined that Community Type for that record year:\n
        2001-2007: No Community Type\n
        2008-2011: 2008 to 2011 Community Types\n
        2012-201: 2012 to 201 Commuinity Types\n
        2016-2019: 2016-2019 Community Types\n
        2020 to Current: 2020-2040 (MTP/SCS)\n'

