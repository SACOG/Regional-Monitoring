
# Documentation yaml file
# To help write the Source, Year, and Notes about each indicator used in RHAN products



CALPADS:

  FARM_1:
    Indicator Title:
    - Migrant Worker Student Population
    Source:
    - California Department of Education, California Longitudinal Pupil Achievement Data System (CALPADS), Cumulative Enrollment Data (Academic Years 2020-2021, 2021-2022, 2022-2023, 2023-2024)
    Website:
    - https://www.cde.ca.gov/ds/ad/filesenrcum.asp
    Year(s):
    - 2020-2024
    Notes: 'This indicator shows the total population of students from migrant workers.\n
      The data used for this table was obtained at the school site level, matched to a file containing school locations, geocoded and assigned to jurisdiction, and finally summarized by geography.'


DOF:

  POPEMP_1:
    Indicator Title:
    - Total Population Difference Relative to Base Year (%)
    Source:
    - Department of Finance, series E-5
    Website:
    - https://dof.ca.gov/forecasting/demographics/
    Year(s):
    - 2001-2023
    Notes: 'This indicator shows the total population estimate by year.\n
      The data shown on the graph represents the population for the jurisdiction, county, and region indexed to the population in the year 2000 (or the first year of incorporation).\n
      The data points represent the relative population growth in each of these geographies relative to their populations in 2000 (or the first year of incorporation)'

  HSG_1:
    Indicator Title:
    - Housing Type Trends
    Source:
    - Department of Finance, series E-5
    Website:
    - https://dof.ca.gov/forecasting/demographics/
    Year(s):
    - 2001-2023
    Notes: 'This indicator shows the total population estimate by year.\n
      The data shown on the graph represents the population for the jurisdiction, county, and region indexed to the population in the year 2000 (or the first year of incorporation).\n
      The data points represent the relative population growth in each of these geographies relative to their populations in 2000 (or the first year of incorporation)'


