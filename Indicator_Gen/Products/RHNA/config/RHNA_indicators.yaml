LEHD:

  POPEMP_11:
    Indicator Title:
    - Jobs in a Jurisdiction
    Source:
    - U.S. Census Bureau, Longitudinal Employer-Household Dynamics survey, Workplace Area Characteristic (WAC) files
    Website:
    - https://lehd.ces.census.gov/data/
    Year(s):
    - 2002-2022
    Notes: 'The data is tabulated by place of work, regardless of where a worker lives. The source data is provided at the census block level. These are crosswalked to jurisdictions and summarized.\n
      Industry NAICS groupings are as follows:\n
      11, 21->Agriculture & Natural Resources; 71, 72, 81->Arts, Recreation & Other Services; 23->Construction; 52, 53->Financial & Leasing; 92->Government;\n
      61, 62->Health & Educational Services; 51->Information; 31-33, 42->Manufacturing & Wholesale; 54, 55, 56->Professional & Managerial Services; 44-45->Retail; 22, 48-49->Transportation & Utilities'

  POPEMP_12:
    Indicator Title:
    - Job Holders in a Jurisdiction by Industry
    Source:
    - U.S. Census Bureau, Longitudinal Employer-Household Dynamics survey, Residence Area Characteristic (RAC) files
    Website:
    - https://lehd.ces.census.gov/data/
    Year(s):
    - 2002-2022
    Notes: 'The data is tabulated by place of residence, regardless of location of workplace. The source data is provided at the census block level. These are crosswalked to jurisdictions and summarized.\n
      Industry NAICS groupings are as follows:\n
      11, 21->Agriculture & Natural Resources; 71, 72, 81->Arts, Recreation & Other Services; 23->Construction; 52, 53->Financial & Leasing; 92->Government;\n
      61, 62->Health & Educational Services; 51->Information; 31-33, 42->Manufacturing & Wholesale; 54, 55, 56->Professional & Managerial Services; 44-45->Retail; 22, 48-49->Transportation & Utilities'

  POPEMP_13:
    Indicator Title:
    - Jobs-Household Ratio
    Source:
    - U.S. Census Bureau, Longitudinal Employer-Household Dynamics survey, Workplace Area Characteristic (WAC) files and DOF E5 Household Estimates
    Website:
    - https://lehd.ces.census.gov/data/
    Year(s):
    - 2002-2022
    Notes: 'The data is tabulated by place of work, regardless of where a worker lives. The source data is provided at the census block level. These are crosswalked to jurisdictions and summarized.\n
      A similar measure is the ratio of jobs to housing units. However, this jobs-household ratio serves to compare the number of jobs in a jurisdiction to the number of housing units that are actually occupied.\n
      The difference between a jurisdiction jobs-housing ratio and jobs-household ratio will be most pronounced in jurisdictions with high vacancy rates, a high rate of units used for seasonal use, or a high rate of units used as short-term rentals
      Industry NAICS groupings are as follows:\n
      11, 21->Agriculture & Natural Resources; 71, 72, 81->Arts, Recreation & Other Services; 23->Construction; 52, 53->Financial & Leasing; 92->Government;\n
      61, 62->Health & Educational Services; 51->Information; 31-33, 42->Manufacturing & Wholesale; 54, 55, 56->Professional & Managerial Services; 44-45->Retail; 22, 48-49->Transportation & Utilities'

  POPEMP_14:
    Indicator Title:
    - Jobs-Household Ratio
    Source:
    - U.S. Census Bureau, Longitudinal Employer-Household Dynamics survey, Residence Area Characteristic (RAC) files, and Workplace Area Characteristic (WAC) files 
    Website:
    - https://lehd.ces.census.gov/data/
    Year(s):
    - 2002-2022
    Notes: 'The ratio compares job counts by wage group from two tabulations of LEHD data: Counts by place of work relative to counts by place of residence.'