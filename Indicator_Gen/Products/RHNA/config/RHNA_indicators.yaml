
# Documentation yaml file
# To help write the Source, Year, and Notes about each indicator used in RHAN products


DDS:
  DISAB_4:
    Indicator Title:
    - Population with Developmental Disabilities by Age
    Source:
    - California Department of Developmental Services, Quarterly Consumer Report by age group and residence type
    Website:
    - https://www.dds.ca.gov/transparency/facts-stats/
    Year(s):
    - 2022-2024
    Notes: 'The California Department of Developmental Services is responsible for overseeing the coordination and delivery of services to more than 330,000 Californias with\n
      developmental disabilities including cerebral palsy, intellectual disability, Down syndrome, autism, epilepsy, and related conditions.\n
      The California Department of Developmental Services provides ZIP code level counts.  To get to jurisdiction-level estimates, ZIP code counts were crosswalked to\n
      jurisdictions using census block group population counts from the 2023 ACS 1 year estimates to determine the share of a ZIP code to assign to a given jurisdiction.'


EDD:
  POPEMP_15:
    Indicator Title:
    - Unemployment Rate
    Source:
    - California Employment Development Department, Local Area Unemployment Statistics (LAUS), Sub-county areas monthly updates, 2010-2025.
    Website:
    - https://data.ca.gov/dataset/local-area-unemployment-statistics-laus
    Year(s):
    - 2010-2025
    Notes: 'This indicator shows the unemployment rate over time.'


Zillow:
  HSG_8:
    Indicator Title:
    - Zillow Home Value Index (ZHVI)
    Source:
    - Zillow, Zillow Home Value Index (ZHVI)
    Website:
    - https://www.zillow.com/research/data/
    Year(s):
    - 2001-2025
    Notes: 'Zillow describes the ZHVI as a smoothed, seasonally adjusted measure of the typical home value and market changes across a given region and housing type.\n
      The ZHVI reflects the typical value for homes in the 35th to 65th percentile range.\n
      Includes all owner-occpied housing units, including both single-family homes and condominiums.\n
      The regional estimate is a household-weighted average of county-level ZHVI files, using yearly household count estimates from DOF E5 series.
      For unincorporated communities, the value is a population weighted average of unincorporated communities in the county matched to census-designated population counts.'


CALPADS:

  FARM_1:
    Indicator Title:
    - Migrant Worker Student Population
    Source:
    - California Department of Education, California Longitudinal Pupil Achievement Data System (CALPADS), Cumulative Enrollment Data (Academic Years 2020-2021, 2021-2022, 2022-2023, 2023-2024)
    Website:
    - https://www.cde.ca.gov/ds/ad/filesenrcum.asp
    Year(s):
    - 2020-2024
    Notes: 'This indicator shows the total population of students from migrant workers.\n
      The data used for this table was obtained at the school site level, matched to a file containing school locations, geocoded and assigned to jurisdiction, and finally summarized by geography.'

  HOMELS_5:
    Indicator Title:
