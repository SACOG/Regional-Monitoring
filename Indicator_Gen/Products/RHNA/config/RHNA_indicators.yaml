
# Documentation yaml file
# To help write the Source, Year, and Notes about each indicator used in RHAN products



HCD:

  HSG_11:
    Indicator Title:
    - Housing Permitting
    Source:
    - California Department of Housing and Community Development (HCD), 5th Cycle Annual Progress Report Permit Summary (2020) (soon to be 6th or 7th?)
    Website:
    - https://www.hcd.ca.gov/planning-and-community-development/housing-elements
    Year(s):
    - '2015-2019'
    Notes: 'HCD uses the following definitions for the four income categories:\n
      - Very Low Income: units affordable to households making less than 50% of the Area Median Income for the county in which the jurisdiction is located.\n
      = Low Income: units affordable to households making between 50% and 80% of the Area Median Income for the county in which the jurisdiction is located.\n
      - Moderate Income: units affordable to households making between 80% and 120% of the Area Median Income for the county in which the jurisdiction is located.\n
      - Above Moderate Income: units affordable to households making above 120% of the Area Median Income for the county in which the jurisdiction is located.'



USDA:

  FARM_2:
    Indicator Title:
    - Farm Operations and Farm Labor by County
    Source:
    - U.S. Department of Agriculture, Census of Agriculture (Table 7, Hired Farm Labor)
    Website:
    - https://www.nass.usda.gov/Publications/AgCensus/2022/index.php, https://agcensus.library.cornell.edu/census_year/2012-census/
    Year(s):
    - '2002-2022'
    Notes: 'Farm workers are considered seasonal if they work on a farm less than 150 days in a year,\n
      while farm workers who work on a farm more than 150 days are considered to be permanent workers for that farm.'



FFIEC:

  AFFH_1:
    Indicator Title:
    - Mortgage Applications and Acceptance by Race
    Source:
    - Federal Financial Institutions Examination Council's (FFIEC) Home Mortgage Disclosure Act loan/application register (LAR) files
    Website:
    - https://ffiec.cfpb.gov/data-publication/modified-lar/2024
    Year(s):
    - '2024-'
    Notes: '“Loan originated” means that the application was accepted a loan was made by a financial institution to the applicant.\n
     “File incomplete or withdrawn” means a loan was not originated because the application was withdrawn before a credit decision was made or the file was closed for incompleteness.\n
     “Application denied” means a loan was not originated because the financial institution did not approve the mortgage application.\n
     “Application approved but not accepted” means the financial institution approved the loan application but the applicant did not complete the transaction and a loan was not originated.'


HUD:

  HOMELS_1:
    Indicator Title:
    - Homelessness by Household Type and Shelter Status
    Source:
    - U.S. Department of Housing and Urban Development (HUD), Continuum of Care (CoC) Homeless Populations and Subpopulations Reports
    Website:
    - https://www.hudexchange.info/programs/coc/coc-homeless-populations-and-subpopulations-reports/
    Year(s):
    - '2024-'
    Notes: 'This data is based on Point-in-Time (PIT) information provided to HUD by CoCs in the application for CoC Homeless Assistance Programs.\n
     The PIT Count provides a count of sheltered and unsheltered homeless persons on a single night during the last ten days in January.\n
     Each Sacramento region county is its own CoC except for combining Yuba/Sutter, and so the data for this table is provided at the county-level'
      
  HOMELS_2:
    Indicator Title:
    - Racial Group Share of General and Homeless Populations
    Source:
    - U.S. Department of Housing and Urban Development (HUD), Continuum of Care (CoC) Homeless Populations and Subpopulations Reports
    Website:
    - https://www.hudexchange.info/programs/coc/coc-homeless-populations-and-subpopulations-reports/
    Year(s):
    - '2024-'
    Notes: 'This data is based on Point-in-Time (PIT) information provided to HUD by CoCs in the application for CoC Homeless Assistance Programs.\n
     The PIT Count provides a count of sheltered and unsheltered homeless persons on a single night during the last ten days in January.\n
     Each Sacramento region county is its own CoC except for combining Yuba/Sutter, and so the data for this table is provided at the county-level.\n
     Per HCD requirements, jurisdictions will need to supplement this county-level data with local estimates of people experiencing homelessness.\n
     HUD does not disaggregate racial demographic data by Hispanic ethnicity for people experiencing homelessness. \n
     Instead, HUD reports data on Hispanic ethnicity for people experiencing homelessness in a separate table. \n
     Accordingly, the racial group data listed here includes both Hispanic and non-Hispanic individuals.'
      
  HOMELS_4:
    Indicator Title:
    - Characteristics for the Population Experiencing Homelessness
    Source:
    - U.S. Department of Housing and Urban Development (HUD), Continuum of Care (CoC) Homeless Populations and Subpopulations Reports
    Website:
    - https://www.hudexchange.info/programs/coc/coc-homeless-populations-and-subpopulations-reports/
    Year(s):
    - '2024-'
    Notes: 'This data is based on Point-in-Time (PIT) information provided to HUD by CoCs in the application for CoC Homeless Assistance Programs.\n
     The PIT Count provides a count of sheltered and unsheltered homeless persons on a single night during the last ten days in January.\n
     Each Sacramento region county is its own CoC except for combining Yuba/Sutter, and so the data for this table is provided at the county-level.\n
     Per HCD requirements, jurisdictions will need to supplement this county-level data with local estimates of people experiencing homelessness.\n
     These challenges/characteristics are counted separately and are not mutually exclusive, as an individual may report more than one challenge/characteristic.\n
     These counts should not be summed.'




DDS:

  DISAB_4:
    Indicator Title:
    - Population with Developmental Disabilities by Age
    Source:
    - California Department of Developmental Services, Quarterly Consumer Report by age group and residence type
    Website:
    - https://www.dds.ca.gov/transparency/facts-stats/
    Year(s):
    - 2022-2024
    Notes: 'The California Department of Developmental Services is responsible for overseeing the coordination and delivery of services to more than 330,000 Californias with\n
      developmental disabilities including cerebral palsy, intellectual disability, Down syndrome, autism, epilepsy, and related conditions.\n
      The California Department of Developmental Services provides ZIP code level counts.  To get to jurisdiction-level estimates, ZIP code counts were crosswalked to\n
      jurisdictions using census block group population counts from the 2023 ACS 1 year estimates to determine the share of a ZIP code to assign to a given jurisdiction.'

  DISAB_5:
    Indicator Title:
    - Population with Developmental Disabilities by Residence
    Source:
    - California Department of Developmental Services, Quarterly Consumer Report by age group and residence type
    Website:
    - https://www.dds.ca.gov/transparency/facts-stats/
    Year(s):
    - 2022-2024
    Notes: 'The California Department of Developmental Services is responsible for overseeing the coordination and delivery of services to more than 330,000 Californias with\n
      developmental disabilities including cerebral palsy, intellectual disability, Down syndrome, autism, epilepsy, and related conditions.\n
      The California Department of Developmental Services provides ZIP code level counts.  To get to jurisdiction-level estimates, ZIP code counts were crosswalked to\n
      jurisdictions using census block group population counts from the 2023 ACS 1 year estimates to determine the share of a ZIP code to assign to a given jurisdiction.'


