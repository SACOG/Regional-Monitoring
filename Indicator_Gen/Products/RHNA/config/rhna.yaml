# Assisted Housing Developments at Risk of Conversion --------------------------------------------------------------------------------------------------------------------------------------------------


RISK_1:
  Theme: Housing Stock Characteristics
  Title: Assisted Units at Risk of Conversion
  Source: California Housing Partnership (CHP)
  Abbrv: CHP
  Website: https://chpc.net/
  Year(s): May 2025
  word:
    transpose: True
    percent: True
    subgroup: Risk Level
  Notes: 'This indicator shows the total population estimate, as well as the percentage.\n
    Includes subsidized, affordable developments financed and/or assisted by HUD, CalHFA, LIHTC, HCD, and USDA. A subset of locally financed and/or assisted development are included based on availability of data.\n
    - While California Housing Partnership’s Preservation Database is the state’s most comprehensive source of information on subsidized affordable housing at risk of losing\n
    its affordable status and converting to market-rate housing, this database does not include all deed-restricted affordable units in the state. Consequently, there may be\n
    at-risk assisted units in a jurisdiction that are not captured in this data table.\n
    - Per HCD guidance, local jurisdictions must also list the specific affordable housing developments at-risk of converting to market rate uses. This document provides\n
    aggregate numbers of at-risk units for each jurisdiction, but local planning staff should contact Danielle Mazzella with the California Housing Partnership at dmazzella@chpc.net\n
    to obtain a list of affordable properties that fall under this designation.\n
    - California Housing Partnership uses the following categories for assisted housing developments in its database:\n
    --- Very-High Risk: affordable homes that are at-risk of converting to market rate within the next year that do not have a known overlapping subsidy that would extend affordability and are not owned by a large/stable non-profit, mission-driven developer.\n
    --- High Risk: affordable homes that are at-risk of converting to market rate in the next 1-5 years that do not have a known overlapping subsidy that would extend affordability and are not owned by a large/stable non-profit, mission-driven developer.\n
    --- Moderate Risk: affordable homes that are at-risk of converting to market rate in the next 5-10 years that do not have a known overlapping subsidy that would extend affordability and are not owned by a large/stable non-profit, mission-driven developer.\n
    --- Low Risk: affordable homes that are at-risk of converting to market rate in 10+ years and/or are owned by a large/stable non-profit, mission-driven developer.'
