  Notes: 'This data is based on Point-in-Time (PIT) information provided to HUD by CoCs in the application for CoC Homeless Assistance Programs.\n
    The PIT Count provides a count of sheltered and unsheltered homeless persons on a single night during the last ten days in January.\n
    Each Sacramento region county is its own CoC except for combining Yuba and Sutter (combined into a single CoC), and so the data for this table is provided at the county-level (or bi-county for Yuba/Sutter).\n
    Per HCD requirements, jurisdictions will need to supplement this county-level data with local estimates of people experiencing homelessness.'
    
