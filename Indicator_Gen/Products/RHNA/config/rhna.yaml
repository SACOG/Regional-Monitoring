AFFH_1:
  Theme: Affirmatively Furthering Fair Housing
  Title: Mortgage Applications and Acceptance by Race
  Source: Federal Financial Institutions Examination Council's (FFIEC) Home Mortgage Disclosure Act loan/application register (LAR) files
  Abbrv: FFIEC
  Website: https://ffiec.cfpb.gov/data-publication/modified-lar/2024
  Year(s): 2024-
  Word:
    Table Transpose: False
    Percent Column: True
    Subgroup: Race/Ethnicity
  Notes: '“Loan originated” means that the application was accepted a loan was made by a financial institution to the applicant.\n
    “File incomplete or withdrawn” means a loan was not originated because the application was withdrawn before a credit decision was made or the file was closed for incompleteness.\n
    “Application denied” means a loan was not originated because the financial institution did not approve the mortgage application.\n
    “Application approved but not accepted” means the financial institution approved the loan application but the applicant did not complete the transaction and a loan was not originated.'

AFFH_2:
  Theme: Affirmatively Furthering Fair Housing
  Title: Population Living in High Resource Areas by Race
  Source: California Tax Credit Allocation Committee (TCAC)/California Housing and Community Development (HCD), Opportunity Maps (2020); U.S. Census Bureau, American Community Survey 5-Year Data, Table B03002
  Abbrv: ACS5
  Website: https://www.treasurer.ca.gov/ctcac/opportunity.asp, https://www.census.gov/programs-surveys/acs/data.html
  Year(s): 2019-2023
  Word:
    Table Transpose: True
    Percent Column: True
    Subgroup: Race/Ethnicity
  Notes: 'This indicator shows the total population estimate, as well as the percentage.\n
    The data are reported in 5 year rolling averages. For example, the 2023 output is not the individual year of 2023, but the 5 year average of 2019-2023.\n
    The TCAC and HCD created the Opportunity Map using reliable and publicly available data sources to identify areas in the state whose characteristics have been shown by research to support\n
    positive economic, educational, and health outcomes for low-income families and their children.  The TCAC/HCD Opportunity Map uses 21 indicators to calculate opportunity index scores for\n
    census tracts in each region in California.  For more information on these indicators, see the Opportunity Map methodology document.\n
    The TCAC/HCD Opportunity Map categorizes census tracts into five groups based on opportunity index scores:\n
    - Highest Resource\n
    - High Resource\n
    - Moderate Resource/Moderate Resource (Rapidly Changing)\n
    - Low Resource\n
    - High Segregation & Poverty\n
    Before an area receives an opportunity index score, census tracts are filtered into the High Segregation & Poverty category.  The filter identifies census tracts where at least 30% of population is\n
    below the federal poverty line and there is a disproportionate share of households of color.  After filtering out High Segregation and Poverty areas, the TCAC/HCD Opportunity Map allocates the 20% of\n
    tracts in each region with the highest relative opportunity index scores to the Highest Resource designation and the next 20% to the High Resource designation.  The remaining non-filtered tracts are\n
    then evenly divided into Low Resource and Moderat Resource categories.\n\n
    HRA data is available at the census tract level.\n
    Staff aggregated tracts up to jurisdiction level using ACS 2019-2023 5-year estimates for the population estimates at the census tract level.\n
    Any census tract that intersects with the jurisdiction was included in the total population roll up, which can result in a high population estimate compared to other indicators.'

