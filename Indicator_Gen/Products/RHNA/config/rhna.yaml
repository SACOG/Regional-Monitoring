# Population, Employment, and Household Characteristics --------------------------------------------------------------------------------------------------------------------------------------------------


POPEMP_1:
  Theme: Population, Employment, and Household Characteristics
  Title: Total Population Difference Relative to Base Year (%)
  Source: Department of Finance, series E-5
  Abbrv: DOF
  Website: https://dof.ca.gov/forecasting/demographics/
  Year(s): 2000-2024
  Value: Population
  Geography: Regional Comparison
  Columns: Year<>[jurisdiction]<>[county]<>SACOG Region<>[jurisdiction] (% Difference from 2000)<>[county] (% Difference from 2000)<>SACOG Region (% Difference from 2000)
  plot:
    bar: False
    line: True
    format: percent
    text: False
    x: Year
    y: Percent Difference
    color: Geography
  word:
    transpose: False
    percent: False
    subgroup: Year
  Notes: 'This indicator shows the total population estimate by year.\n
    The data shown on the graph represents the population for the jurisdiction, county, and region indexed to the population in the year 2000 (or the first year of incorporation).\n
    The data points represent the relative population growth in each of these geographies relative to their populations in 2000 (or the first year of incorporation)'

