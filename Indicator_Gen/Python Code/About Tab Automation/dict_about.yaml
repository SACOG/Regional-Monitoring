    Description:
    - 5 year rolling average of population at various geographies in three age cohorts
      (below 18, 18 to 64, and 65 and above)
    Geography:
    - SACOG Region (MPO), counties, and census tracts
    Website:
    - https://www.census.gov/programs-surveys/acs/data.html
    Last Updated:
    - date.today().strftime('%Y-%m-%d')
    Margin of Error Limit:
    - 5
    Notes: 'Each of these geographies has the total population estimate by age cohort,
      as well as the percentage. Key terms Rolling Average: The data are reported in
      5 year rolling averages. For example, the 2022 output is not the individual year
      of 2022, but the 5 year average of 2018-2022. Users looking for single year results
      should use the separate 1 year ACS series Margin of Error: all ACS outputs are
      estimates. The downloadable data includes the margin of error statistics. Users
      should pay particular to the margin of error, especially for smaller geographies
      and race/ethnicity groups with relatively less population.  State and County FIPS
      are census numeric codes for different geographies'

