Zillow:
  Cost_1:
    Indicator Title:
    - Average Sale Price of Homes
    Source:
    - Zillow
    Year(s):
    - str(np.min(df['Year'].unique())) + '-' + str(np.max(df['Year'].unique()))
    Description:
    - Home sale prices are approximated with the Zillow Home Value Index. In their own words, this index is "a measure of the typical home value and market changes across a given region and housing type. It reflects the typical value for homes in the 35th to 65th percentile range. Available as a smoothed, seasonally adjusted measure and as a raw measure." The smoothed measure is used here.
    Geography:
    - CA MPOs (region); national mid sized MSAs; County, City ZIP (SACOG only)
    Website:
    - https://www.zillow.com/research/data/
    Last Updated:
    - date.today().strftime('%Y-%m-%d')
    Notes:
    - 

  Cost_2:
    Indicator Title:
    - Monthly Rent Price
    Source:
    - Zillow
    Year(s):
    - str(np.min(df['Year'].unique())) + '-' + str(np.max(df['Year'].unique()))
    Description:
    - This data uses the Zillow Observed Rent Index. In their own words, this is "a smoothed measure of the typical observed market rate rent across a given region. ZORI is a repeat-rent index that is weighted to the rental housing stock to ensure representativeness across the entire market, not just those homes currently listed for-rent. The index is dollar-denominated by computing the mean of listed rents that fall into the 40th to 60th percentile range for all homes and apartments in a given region, which is weighted to reflect the rental housing stock."
    Geography:
    - MSA, MPO, County, Cities, ZIP (SACOG only)
    Website:
    - https://www.zillow.com/research/data/
    Last Updated:
    - date.today().strftime('%Y-%m-%d')
    Notes:
    - DOF has slightly higher vacancy rates than ACS (DOF includes sold/rented but not yet occupied). \n Could consider moving to ACS in future, but dont have ACS for all our counties

