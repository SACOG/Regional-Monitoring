# MASTER FILE FOR ABOUT TAB EXPORTS.

# If you want to edit any of these indicators, it's easiest to just CTRL + F the sample or indicator, and edit from there. 

# A lot of these were built from already existing about tabs. 

# Note: For the Census, we have both 5 year and 1 year samples we have to worry about.
# Bc of this, there are two nests. '5YEAR' and '1YEAR'. User must define which one they want to pull by defining so in the function call. 

DOF:  
  Pop_1:
    Indicator Title:
    - Population
    Source:
    - California Department of Finance E-5 (current decade) and E-8 (prior) series
    Year(s):
    - 
    Description:
    - Estimated population
    Geography:
    - County
    Website:
    - https://dof.ca.gov/forecasting/demographics/estimates/
    Last Updated:
    - 
    Notes: The Department of Finance prepares its population estimates in ten-year series. \n
      Each ten-year series begins with the results of the decennial census (census benchmark). \n
      Users should pay careful attention when using data that spans two decennial census
      periods, as the difference between the final year of the prior series and the
      first of the new may stem largely from the new census benchmark. \n The monitoring
      program uses the decennial census benchmark for the decennial years (2000, 2010,
      2020 etc.). \n The decennial census benchmark is for April 1st of the decennial year;
      all other population estimates are for January 1st of the given year.
