  ACS:
    Pop_3:
      Indicator Title:
      - Population by Race/Ethnicity
      Source:
      - Census 5 year ACS (American Community Survey)
      Year(s):
      - 
      Description:
      - 5 year rolling average of population at various geographies based Census Bureau
        race/ethnicity categories
      Geography:
      - SACOG Region (MPO), counties, and census tracts
      Website:
      - https://www.census.gov/programs-surveys/acs/data.html
      Last Updated:
      - 
      Margin of Error Limit:
      - 5
      Notes: 'Each of these geographies has the total population estimate by race/ethnicity,
        as well as the percentage. \n Key terms \n Rolling Average: The data are reported in
        5 year rolling averages. For example, the 2022 output is not the individual year
        of 2022, but the 5 year average of 2018-2022. Users looking for single year results
        should use the separate 1 year ACS series. \n Margin of Error: all ACS outputs are
        estimates. The downloadable data includes the margin of error statistics. Users
        should pay particular to the margin of error, especially for smaller geographies
        and race/ethnicity groups with relatively less population.\n State and County FIPS
        are census numeric codes for different geographies'
